<div class="card">
  <div class="card-header">
    <h5>Employees</h5>
  </div>
  <div class="card-body">

    <div *ngIf="isMessage === true" class="alert alert-success alert-dismissible fade show">

      {{message}}

      <button type="button" class="btn-close"
              data-bs-dismiss="alert"></button>

    </div>
    
    <div class="mb-3 d-flex justify-content-end">
      <button class="btn btn-success me-2" (click)="handleAdd()">
        <i class="bi bi-plus-circle"></i> Add Employee
      </button>
    </div>

    <table id="employeeTable" class="table table-striped table-hover table-bordered">
      <thead class="table-dark">
        <tr>
          <th>Sno</th>
          <th>Employee ID</th>
          <th>Employee Name</th>
          <th>Email</th>
          <th>Mobile</th>
          <th>DOB</th>
          <!-- <th>Action</th> -->
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let employee of employees; let i = index">
          <td>{{i+1}}</td>
          <td>{{ employee.employee_id}}</td>
          <td>{{ employee.emp_firstname}} {{ employee.emp_lastname}}</td>
          <td>{{ employee.emp_work_email}}</td>
          <td>{{ employee.emp_mobile}}</td>
          <td>{{ employee.emp_birthday}}</td>
          <!-- <td>
            <div class="mb-3">
              <button class="btn btn-success me-2">
                <i class="bi bi-pencil-square"></i>
              </button>

              <button class="btn btn-danger">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td> -->
        </tr>
      </tbody>
    </table>
  </div>

</div>
